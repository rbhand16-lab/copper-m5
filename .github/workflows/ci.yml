name: CI

# Runs on every pull request, and on main after a merge.
# Branch protection on main requires these checks (see docs/architecture.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Students work on macOS and Windows; Vercel builds on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The golden-set evaluation: real questions to Ask Copper, graded by an AI
  # judge, scores saved in Langfuse. It fails when the answers are not good
  # enough, and when a key is missing (CI never skips it).
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run eval
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_TRACING_ENVIRONMENT: ci
      # Put the scores where the reviewer looks: the run summary, and a
      # comment on the pull request (skipped on forks, which can't comment).
      - name: Show the scores
        if: always()
        run: |
          if [ -f evals/results/golden.md ]; then
            cat evals/results/golden.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Comment the scores on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f evals/results/golden.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file evals/results/golden.md
          fi
